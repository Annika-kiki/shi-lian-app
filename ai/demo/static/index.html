<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>食练周期 · AI 饮食与训练</title>
  <script>if(location.protocol==='file:')location.replace('http://127.0.0.1:8000/');</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#20352d;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:820px;margin:auto;padding:26px 18px 50px}h1,h2,h3{margin-top:0}.sub{color:#61766b}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;padding:12px;border:1px solid #aac0b3;border-radius:13px;background:#fffdf8;color:#20352d;font:inherit;cursor:pointer}.tabs button.on{background:#477c63;color:white}.view.hidden,.hidden{display:none}.panel{background:#fffdf8;border:1px solid #ded9cd;border-radius:20px;padding:18px;margin-top:16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.chip{border:1px solid #aac0b3;background:#edf3ee;border-radius:99px;padding:8px 12px;cursor:pointer}.chip.on{background:#477c63;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:10px 0 6px;font-size:14px}input,select{width:100%;padding:12px;border:1px solid #cfcabd;border-radius:12px;background:white;font:inherit}button.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#477c63;color:white;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#e3eee5;border-radius:13px;padding:10px}.metric b{display:block;font-size:20px}.recipe-card,.session{border-top:1px solid #ded9cd;padding:16px 0}.recipe-card:first-child,.session:first-child{border-top:0}.badge{display:inline-block;background:#e3eee5;border-radius:99px;padding:5px 9px;font-size:12px;margin-right:5px}.recipe-button{border:1px solid #477c63;color:#477c63;background:transparent;border-radius:10px;padding:8px 11px;cursor:pointer}.error{color:#a43030}ol{padding-left:22px}.exercise{padding:9px 0;border-bottom:1px solid #e6e0d5}.exercise:last-child{border-bottom:0}.exercise-art{width:100%;border-radius:16px;border:1px solid #ded9cd;margin:8px 0 12px;background:#f3f0e7}.notice{background:#fff4d7;border-radius:12px;padding:10px 12px;color:#654d16;font-size:13px}@media(max-width:560px){.row,.metrics{grid-template-columns:1fr 1fr}.metrics{font-size:13px}}
  </style>
</head>
<body><main>
  <h1>🌿 食练周期</h1><p class="sub">吃得有滋味，练得有计划。</p>
  <nav class="tabs"><button class="on" data-view="food">AI 食谱</button><button data-view="training">训练计划</button><button data-view="library">动作库</button></nav>

  <section class="view" id="food-view">
    <div class="panel"><h2>用现有食材做一顿真正好吃的健身餐</h2>
      <label for="ingredients">已有食材（用逗号分隔）</label><input id="ingredients" value="鸡胸肉, 西红柿, 西兰花, 米饭">
      <div class="row"><div><label for="kcal">目标热量 kcal</label><input id="kcal" type="number" value="500" min="250" max="1000"></div><div><label>饮食偏好</label><div class="chips"><button class="chip on" type="button">高蛋白</button><button class="chip on" type="button">少油</button></div></div></div>
      <button class="primary" id="generate-food">✨ 生成 3 种菜式</button><p class="error hidden" id="food-error"></p>
    </div>
    <div class="panel hidden" id="food-results"><p class="sub">按菜式、味型与烹饪方式生成</p><div id="recipe-list"></div></div>
    <div class="panel hidden" id="recipe-detail"></div>
  </section>

  <section class="view hidden" id="training-view">
    <div class="panel"><h2>生成本周训练计划</h2><div class="row"><div><label for="goal">健身目标</label><select id="goal"><option>减脂</option><option>增肌</option><option>保持健康</option></select></div><div><label for="level">训练水平</label><select id="level"><option>新手</option><option>中级</option></select></div></div><label for="days">每周训练天数</label><select id="days"><option value="2">2 天</option><option value="3" selected>3 天</option><option value="4">4 天</option><option value="5">5 天</option></select><button class="primary" id="generate-training">🏋️ 生成训练计划</button><p class="error hidden" id="training-error"></p></div>
    <div class="panel hidden" id="training-result"></div>
  </section>

  <section class="view hidden" id="library-view"><div class="panel"><h2>动作资料库</h2><p class="sub">每个动作包含目标肌群、器械、等级、步骤和安全提醒。</p><p class="notice">实体为起始姿势，半透明虚影为结束姿势，箭头表示运动方向；红色区域表示主要发力肌群。示意图不能代替教练现场指导或医疗建议。</p><div class="chips" id="muscle-filter"><button class="chip on">全部</button><button class="chip">胸</button><button class="chip">背</button><button class="chip">腿臀</button><button class="chip">肩</button><button class="chip">核心</button></div><div id="exercise-list"></div></div></section>
</main>
<script>
const state={recipes:[],exercises:[]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.view+'-view'));if(b.dataset.view==='library'&&!state.exercises.length)loadExercises()}));
document.querySelectorAll('#food-view .chip').forEach(b=>b.addEventListener('click',()=>b.classList.toggle('on')));
document.getElementById('generate-food').addEventListener('click',async()=>{const error=document.getElementById('food-error');error.classList.add('hidden');try{const response=await fetch('/api/recipes/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients:document.getElementById('ingredients').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),target_kcal:Number(document.getElementById('kcal').value),preferences:[...document.querySelectorAll('#food-view .chip.on')].map(x=>x.textContent)})});const data=await response.json();if(!response.ok)throw new Error(data.message);state.recipes=data.recipes;document.getElementById('recipe-list').innerHTML=state.recipes.map((r,i)=>`<article class="recipe-card"><p><span class="badge">${esc(r.style)}</span><span class="badge">${r.estimated_minutes} 分钟</span></p><h3>${esc(r.name)}</h3><p>${esc(r.description)}</p><p><b>${r.nutrition.kcal} kcal</b>　蛋白质 ${r.nutrition.protein}g　脂肪 ${r.nutrition.fat}g</p><button class="recipe-button" data-recipe="${i}">查看完整做法</button></article>`).join('');document.getElementById('food-results').classList.remove('hidden');document.getElementById('recipe-detail').classList.add('hidden')}catch(e){error.textContent=e.message;error.classList.remove('hidden')}});
document.getElementById('recipe-list').addEventListener('click',e=>{const b=e.target.closest('[data-recipe]');if(!b)return;const r=state.recipes[Number(b.dataset.recipe)],box=document.getElementById('recipe-detail');box.innerHTML=`<p class="sub">${esc(r.style)} · ${r.estimated_minutes} 分钟</p><h2>${esc(r.name)}</h2><div class="metrics"><div class="metric">热量<b>${r.nutrition.kcal}</b>kcal</div><div class="metric">蛋白质<b>${r.nutrition.protein}</b>g</div><div class="metric">碳水<b>${r.nutrition.carbs}</b>g</div><div class="metric">脂肪<b>${r.nutrition.fat}</b>g</div></div><h3>食材</h3>${r.ingredients.map(x=>`<p>${esc(x.name)}　<b>${x.grams}g</b></p>`).join('')}<h3>调味</h3><p>${r.seasonings.map(esc).join(' · ')}</p><h3>详细步骤</h3><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="sub">主厨提示：${esc(r.chef_tip)}</p><p class="sub">营养计算：${esc(r.nutrition_source)}</p>`;box.classList.remove('hidden');box.scrollIntoView({behavior:'smooth'})});
document.getElementById('generate-training').addEventListener('click',async()=>{const error=document.getElementById('training-error');error.classList.add('hidden');try{const response=await fetch('/api/training/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:document.getElementById('goal').value,level:document.getElementById('level').value,days:Number(document.getElementById('days').value)})});const p=await response.json();if(!response.ok)throw new Error(p.message);const box=document.getElementById('training-result');box.innerHTML=`<p class="sub">${esc(p.goal)} · ${esc(p.level)} · 每周 ${p.days_per_week} 天</p><h2>你的本周训练</h2>${p.sessions.map(s=>`<article class="session"><h3>Day ${s.day}　${esc(s.name)}</h3><p class="sub">约 ${s.estimated_minutes} 分钟</p>${s.exercises.map(x=>`<div class="exercise"><b>${esc(x.name)}</b>　<span class="badge">${esc(x.muscle)}</span><br><span class="sub">${x.sets} 组 × ${esc(x.reps)} 次 · 休息 ${x.rest_seconds} 秒</span></div>`).join('')}</article>`).join('')}<p class="sub">原则：${esc(p.principle)}</p>`;box.classList.remove('hidden')}catch(e){error.textContent=e.message;error.classList.remove('hidden')}});
async function loadExercises(){const r=await fetch('/api/exercises');const d=await r.json();state.exercises=d.exercises;renderExercises('全部')}
function renderExercises(muscle){const items=muscle==='全部'?state.exercises:state.exercises.filter(x=>x.muscle===muscle);document.getElementById('exercise-list').innerHTML=items.map(x=>`<article class="recipe-card"><h3>${esc(x.name)}</h3><p><span class="badge">${esc(x.muscle)}</span><span class="badge">${esc(x.equipment)}</span><span class="badge">${esc(x.level)}</span></p>${x.illustration?`<img class="exercise-art" src="${esc(x.illustration.url)}" alt="${esc(x.name)}起始姿势、结束虚影与发力肌群示意图" loading="lazy"><p class="sub">红色高亮：${x.illustration.active_muscles.map(esc).join('、')}</p>`:'<p class="sub">教学图正在制作中</p>'}<ol>${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="sub">注意：${esc(x.warning)}</p></article>`).join('')}
document.getElementById('muscle-filter').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#muscle-filter button').forEach(x=>x.classList.toggle('on',x===b));renderExercises(b.textContent)});
</script></body></html>
